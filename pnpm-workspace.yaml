packages:
  - "apps/*"
  - "packages/*"
  - "packages/domain/*"
  - "packages/adapters/*"
allowBuilds:
  "@prisma/engines": true
  prisma: true
overrides:
  # Vulnerable transitive deps of the `prisma` CLI itself (devDependency,
  # build-time only) — see planning/tech-debt/TD-002.md.
  mysql2: ">=3.22.0"
  deepmerge-ts: ">=8.0.0"
  # GHSA-vfj7-8cjw-p6xm: braces (<=3.0.3, no patched release) reaches us only
  # through @next/eslint-plugin-next > fast-glob > micromatch. The plugin calls
  # one fast-glob function, globSync(pattern, { onlyDirectories: true }), and
  # only when settings.next.rootDir is set (ours isn't). tinyglobby has the same
  # globSync and depends on picomatch, not braces. See
  # planning/tech-debt/TD-027.md; remove once the plugin drops fast-glob 3.
  "@next/eslint-plugin-next>fast-glob": "npm:tinyglobby@^0.2.17"
  # GHSA-68fv-2mgg-jv7q (2026-10-06): source-map-js <1.2.2 can be made to loop
  # on crafted index source maps. Reaches us only through build/test tooling
  # (postcss, vite, css-tree); 1.2.2 is a patch release inside every
  # dependent's ^1 range. Remove once the lockfile resolves >=1.2.2 alone.
  source-map-js: ">=1.2.2"
