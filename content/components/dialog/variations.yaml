# Named presets of lcsDialog: each sets inputs with Power Fx formulas.
- name: Confirm delete
  description: Ask before deleting one item. Name the action on the button.
  settings:
    Kind: ="Confirm"
    Title: ="Delete this request?"
    Message: ="It will be removed for everyone. You can't undo this."
- name: Danger, type to confirm
  description: For things that can't be undone. The button unlocks when the user types DELETE.
  settings:
    Kind: ="Danger"
    Title: ="Delete all 48 requests?"
    Message: ="Every request and its history will be removed. You can't undo this."
- name: Form with a reason
  description: Ask for a short answer, such as why a request is rejected.
  settings:
    Kind: ="Form"
    Title: ="Reject this request?"
    Message: ="The requester will see your reason."
    InputLabel: ="Reason for rejecting"
    Buttons: '=Table({Key: "cancel", Label: "Cancel", Style: "Secondary"}, {Key: "reject", Label: "Reject", Style: "Primary"})'
- name: Alert
  description: One button, to tell the user something they must read.
  settings:
    Kind: ="Alert"
    Title: ="Request sent"
    Message: ="Your manager will get an email and a Teams message."
    Buttons: '=Table({Key: "ok", Label: "Got it", Style: "Primary"})'
- name: Unsaved changes
  description: Three choices when leaving a form with changes.
  settings:
    Kind: ="Confirm"
    Title: ="Save your changes?"
    Message: ="You have changes that haven't been saved."
    Icon: ="Warning"
    Buttons: '=Table({Key: "discard", Label: "Don''t save", Style: "Subtle"}, {Key: "cancel", Label: "Cancel", Style: "Secondary"}, {Key: "save", Label: "Save", Style: "Primary"})'
