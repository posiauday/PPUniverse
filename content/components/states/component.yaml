ComponentDefinitions:
  lcsStates:
    DefinitionType: CanvasComponent
    Description: "LowCodeStacks states: one panel for empty, loading and error, with a title, a message and an optional button, and a helper that picks the state for you."
    CustomProperties:
      State:
        PropertyKind: Input
        DisplayName: State
        DataType: Text
        Description: "Empty, Loading or Error. Any other value, such as empty text, shows nothing."
        Default: ="Empty"
      Title:
        PropertyKind: Input
        DisplayName: Title
        DataType: Text
        Description: "A short headline, such as No requests yet. Leave empty to use the default for the state."
        Default: =""
      Message:
        PropertyKind: Input
        DisplayName: Message
        DataType: Text
        Description: "One sentence that says what to do next. Leave empty to use the default for the state."
        Default: =""
      ActionText:
        PropertyKind: Input
        DisplayName: ActionText
        DataType: Text
        Description: "Text for the button, such as New request or Try again. Leave empty for no button."
        Default: ="New request"
      IsShowing:
        PropertyKind: Output
        DisplayName: IsShowing
        DataType: Boolean
        Description: "True when a state is showing. Hide your gallery or form while it is."
      StateFor:
        PropertyKind: OutputFunction
        DisplayName: StateFor
        DataType: Text
        Description: "Picks the state from what your app knows: Loading first, then Error, then Empty when there are no rows, otherwise empty text."
        Parameters:
          - IsLoading:
              DataType: Boolean
              Description: "True while the data is loading."
              Default: =false
          - HasError:
              DataType: Boolean
              Description: "True when loading failed."
              Default: =false
          - RowCount:
              DataType: Number
              Description: "How many rows there are to show."
              Default: =0
      OnAction:
        PropertyKind: Event
        DisplayName: OnAction
        ReturnType: None
        Description: "Runs in the app when the user selects the button. Receives the state it was showing."
        Parameters:
          - State:
              DataType: Text
              Description: "Empty or Error."
              Default: =""
        Default: =false
    Properties:
      Width: =360
      Height: =240
      Fill: =RGBA(0, 0, 0, 0)
      IsShowing: =lcsStates.State in ["Empty", "Loading", "Error"]
      StateFor: =If(IsLoading, "Loading", HasError, "Error", RowCount = 0, "Empty", "")
    Children:
      - spnLoading:
          Control: ModernSpinner@1.1.0
          Properties:
            X: =(Parent.Width - Self.Width) / 2
            Y: =24
            Width: =Min(240, Parent.Width)
            Height: =48
            Visible: =lcsStates.State = "Loading"
            Label: =""
            AccessibleLabel: =lblTitle.Text
      - lblSymbol:
          Control: ModernText@1.0.0
          Properties:
            X: =(Parent.Width - Self.Width) / 2
            Y: =24
            Width: =48
            Height: =48
            Visible: =lcsStates.State in ["Empty", "Error"]
            Text: =If(lcsStates.State = "Error", "!", "○")
            Align: =Align.Center
            Size: =22
            FontWeight: =FontWeight.Bold
            Color: =If(lcsStates.State = "Error", RGBA(166, 21, 46, 1), RGBA(66, 66, 66, 1))
            Fill: =If(lcsStates.State = "Error", RGBA(253, 231, 233, 1), RGBA(240, 240, 240, 1))
            RadiusTopLeft: =24
            RadiusTopRight: =24
            RadiusBottomLeft: =24
            RadiusBottomRight: =24
      - lblTitle:
          Control: ModernText@1.0.0
          Properties:
            X: =16
            Y: =84
            Width: =Parent.Width - 32
            Height: =28
            Visible: =lcsStates.IsShowing
            Text: |-
              =If(
                  !IsBlank(lcsStates.Title), lcsStates.Title,
                  lcsStates.State = "Loading", "Loading…",
                  lcsStates.State = "Error", "Something went wrong",
                  "Nothing here yet"
              )
            Align: =Align.Center
            Size: =16
            FontWeight: =FontWeight.Semibold
      - lblMessage:
          Control: ModernText@1.0.0
          Properties:
            X: =16
            Y: =lblTitle.Y + lblTitle.Height + 4
            Width: =Parent.Width - 32
            Height: =44
            Visible: =lcsStates.IsShowing
            Text: |-
              =If(
                  !IsBlank(lcsStates.Message), lcsStates.Message,
                  lcsStates.State = "Loading", "This only takes a moment.",
                  lcsStates.State = "Error", "Check your connection, then try again.",
                  "When there's something to show, it appears here."
              )
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Top
            Wrap: =true
            Size: =13
            Color: =RGBA(97, 97, 97, 1)
      - btnAction:
          Control: ModernButton@1.0.0
          Properties:
            Width: =Max(120, Len(lcsStates.ActionText) * 9 + 32)
            Height: =36
            X: =(Parent.Width - Self.Width) / 2
            Y: =lblMessage.Y + lblMessage.Height + 12
            Visible: =lcsStates.State in ["Empty", "Error"] && !IsBlank(lcsStates.ActionText)
            Text: =lcsStates.ActionText
            Appearance: =If(lcsStates.State = "Error", ButtonAppearance.Outline, ButtonAppearance.Primary)
            AccessibleLabel: =lcsStates.ActionText
            OnSelect: =lcsStates.OnAction(lcsStates.State)
