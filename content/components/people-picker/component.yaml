ComponentDefinitions:
  lcsPeoplePicker:
    DefinitionType: CanvasComponent
    Description: "LowCodeStacks people picker: search your directory from your app as the user types, choose one or several people, Add me, suggested people, and the chosen people's emails ready for Outlook or Teams."
    CustomProperties:
      Label:
        PropertyKind: Input
        DisplayName: Label
        DataType: Text
        Description: "The field's label, shown above it and read by screen readers."
        Default: ="People"
      Hint:
        PropertyKind: Input
        DisplayName: Hint
        DataType: Text
        Description: "Help text under the field, shown while there's no error. Leave empty for none."
        Default: =""
      Placeholder:
        PropertyKind: Input
        DisplayName: Placeholder
        DataType: Text
        Description: "Text in the empty search box."
        Default: ="Search by name or email"
      Results:
        PropertyKind: Input
        DisplayName: Results
        DataType: Table
        Description: "Your app's search results, with DisplayName, Mail and JobTitle columns. Fill them in OnSearch, such as from Office 365 Users."
        Default: |-
          =FirstN(Table({DisplayName: "", Mail: "", JobTitle: ""}), 0)
      Suggestions:
        PropertyKind: Input
        DisplayName: Suggestions
        DataType: Table
        Description: "People to offer while the search box is empty, such as recent or frequent people. The first three show. Same columns as Results."
        Default: |-
          =FirstN(Table({DisplayName: "", Mail: "", JobTitle: ""}), 0)
      DefaultPeople:
        PropertyKind: Input
        DisplayName: DefaultPeople
        DataType: Table
        Description: "The people chosen when the screen loads, such as a record's approvers. Same columns as Results."
        Default: |-
          =FirstN(Table({DisplayName: "", Mail: "", JobTitle: ""}), 0)
      Me:
        PropertyKind: Input
        DisplayName: Me
        DataType: Record
        Description: "The signed-in user, for the Add me button, with the same columns. Leave Mail empty to hide the button."
        Default: |-
          ={DisplayName: "", Mail: "", JobTitle: ""}
      MaxPeople:
        PropertyKind: Input
        DisplayName: MaxPeople
        DataType: Number
        Description: "The most people that can be chosen. 1 makes a single-person picker; 0 means no limit."
        Default: =0
      MinSearchLength:
        PropertyKind: Input
        DisplayName: MinSearchLength
        DataType: Number
        Description: "How many characters the user types before OnSearch runs."
        Default: =2
      Required:
        PropertyKind: Input
        DisplayName: Required
        DataType: Boolean
        Description: "When true, the label shows * and choosing nobody is an error once the user has changed the field."
        Default: =false
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        DataType: Color
        Description: "Your brand colour, for the search box's focus line and the Add me button."
        Default: =RGBA(15, 108, 189, 1)
      Theme:
        PropertyKind: Input
        DisplayName: Theme
        DataType: Text
        Description: "Light, or Dark for a dark screen."
        Default: ="Light"
      People:
        PropertyKind: Output
        DisplayName: People
        DataType: Table
        Description: "The people chosen, with DisplayName, Mail and JobTitle."
      Emails:
        PropertyKind: Output
        DisplayName: Emails
        DataType: Text
        Description: "The chosen people's email addresses, separated by semicolons, ready for Outlook or Teams."
      Count:
        PropertyKind: Output
        DisplayName: Count
        DataType: Number
        Description: "How many people are chosen."
      SearchText:
        PropertyKind: Output
        DisplayName: SearchText
        DataType: Text
        Description: "The text in the search box now."
      IsValid:
        PropertyKind: Output
        DisplayName: IsValid
        DataType: Boolean
        Description: "True unless the field is required and nobody is chosen."
      OnSearch:
        PropertyKind: Event
        DisplayName: OnSearch
        ReturnType: None
        Description: "Runs in your app when the user pauses typing a new search. Search your directory here and put the people in Results."
        Parameters:
          - Query:
              DataType: Text
              Description: "The search text, trimmed."
              Default: =""
        Default: =false
      OnChange:
        PropertyKind: Event
        DisplayName: OnChange
        ReturnType: None
        Description: "Runs in your app when someone is added or removed. Receives the chosen people's email addresses."
        Parameters:
          - ChosenEmails:
              DataType: Text
              Description: "The chosen people's email addresses, separated by semicolons."
              Default: =""
        Default: =false
      Clear:
        PropertyKind: Action
        DisplayName: Clear
        ReturnType: None
        Description: "Removes everyone and empties the search box."
      Reset:
        PropertyKind: Action
        DisplayName: Reset
        ReturnType: None
        Description: "Goes back to DefaultPeople and empties the search box, such as when another record loads."
    Properties:
      Width: =360
      Height: =380
      Fill: =RGBA(0, 0, 0, 0)
      People: =If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)
      Emails: =Concat(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople), Mail, ";")
      Count: =CountRows(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople))
      SearchText: =Trim(txtSearch.Text)
      IsValid: =IsBlank(If(lcsPeoplePicker.Required && CountRows(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)) = 0, "Choose at least one person.", ""))
      Clear: |-
        =Clear(colPeople);
        Set(locTouched, true);
        Set(locLastSearch, "");
        Reset(txtSearch)
      Reset: |-
        =Clear(colPeople);
        Set(locTouched, false);
        Set(locLastSearch, "");
        Reset(txtSearch)
    Children:
      - tmrSearch:
          Control: Timer@2.1.0
          Properties:
            Visible: =false
            Duration: =400
            Repeat: =true
            AutoStart: =true
            Start: =true
            OnTimerEnd: |-
              =If(
                  Trim(txtSearch.Text) <> locLastSearch && Len(Trim(txtSearch.Text)) >= Max(1, lcsPeoplePicker.MinSearchLength),
                  Set(locLastSearch, Trim(txtSearch.Text));
                  lcsPeoplePicker.OnSearch(Trim(txtSearch.Text))
              )
      - lblLabel:
          Control: ModernText@1.0.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width - 100
            Height: =24
            Text: =lcsPeoplePicker.Label & If(lcsPeoplePicker.Required, " *", "")
            Size: =14
            FontWeight: =FontWeight.Semibold
            Color: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
            Wrap: =false
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
      - icoAddMe:
          Control: ModernIcon@1.1.0
          Properties:
            X: =btnAddMe.X + 8
            Y: =btnAddMe.Y + (btnAddMe.Height - 16) / 2
            Width: =16
            Height: =16
            Visible: =btnAddMe.Visible
            Icon: ="PersonAdd"
            IconColor: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 1), lcsPeoplePicker.AccentColor)
            IconStyle: =IconStyle.Outline
      - lblAddMe:
          Control: ModernText@1.0.0
          Properties:
            X: =btnAddMe.X + 28
            Y: =btnAddMe.Y
            Width: =btnAddMe.Width - 32
            Height: =btnAddMe.Height
            Visible: =btnAddMe.Visible
            Text: ="Add me"
            Size: =12
            FontWeight: =FontWeight.Semibold
            Color: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 1), lcsPeoplePicker.AccentColor)
            Fill: =RGBA(0, 0, 0, 0)
            Align: =Align.Left
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =false
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
      - btnAddMe:
          Control: Classic/Button@2.2.0
          Properties:
            X: =Parent.Width - 92
            Y: =0
            Width: =92
            Height: =24
            Visible: |-
              =!IsBlank(lcsPeoplePicker.Me.Mail) && !(lcsPeoplePicker.MaxPeople > 0 && CountRows(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)) >= lcsPeoplePicker.MaxPeople) &&
                  IsBlank(LookUp(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople), Lower(Mail) = Lower(lcsPeoplePicker.Me.Mail)))
            Text: ="Add me to " & lcsPeoplePicker.Label
            Fill: =RGBA(0, 0, 0, 0)
            Color: =RGBA(0, 0, 0, 0)
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 0.08), RGBA(0, 0, 0, 0.05))
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 0.14), RGBA(0, 0, 0, 0.09))
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(0, 0, 0, 0)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            FocusedBorderColor: =If(lcsPeoplePicker.Theme = "Dark", ColorFade(lcsPeoplePicker.AccentColor, 0.45), lcsPeoplePicker.AccentColor)
            FocusedBorderThickness: =2
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            OnSelect: |-
              =If(
                  !locTouched,
                  ClearCollect(colPeople, lcsPeoplePicker.DefaultPeople);
                  Set(locTouched, true)
              );
              If(
                  IsBlank(LookUp(colPeople, Lower(Mail) = Lower(lcsPeoplePicker.Me.Mail))) &&
                      !(lcsPeoplePicker.MaxPeople > 0 && CountRows(colPeople) >= lcsPeoplePicker.MaxPeople),
                  Collect(colPeople, {DisplayName: lcsPeoplePicker.Me.DisplayName, Mail: lcsPeoplePicker.Me.Mail, JobTitle: lcsPeoplePicker.Me.JobTitle})
              );
              Reset(txtSearch);
              Set(locLastSearch, "");
              lcsPeoplePicker.OnChange(Concat(colPeople, Mail, ";"))
      - galChosen:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            X: =0
            Y: =30
            Width: =Parent.Width
            Height: =Min(2, RoundUp(CountRows(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)) / If(lcsPeoplePicker.MaxPeople = 1, 1, 2), 0)) * 40
            Items: =If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)
            WrapCount: =If(lcsPeoplePicker.MaxPeople = 1, 1, 2)
            TemplateSize: =40
            TemplatePadding: =0
            ShowScrollbar: =true
            BorderStyle: =BorderStyle.None
            AccessibleLabel: =lcsPeoplePicker.Label & ", chosen"
          Children:
            - galChosenPill:
                Control: ModernText@1.0.0
                Properties:
                  X: =0
                  Y: =2
                  Width: =Parent.TemplateWidth - 6
                  Height: =36
                  Text: =ThisItem.DisplayName
                  Size: =13
                  Color: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
                  Fill: =If(lcsPeoplePicker.Theme = "Dark", RGBA(61, 61, 61, 1), RGBA(240, 240, 240, 1))
                  Wrap: =false
                  VerticalAlign: =VerticalAlign.Middle
                  PaddingLeft: =40
                  PaddingRight: =36
                  PaddingTop: =0
                  PaddingBottom: =0
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
            - galChosenAvatar:
                Control: ModernText@1.0.0
                Properties:
                  X: =4
                  Y: =6
                  Width: =28
                  Height: =28
                  Text: =Upper(Left(Trim(ThisItem.DisplayName), 1) & If(CountRows(Split(Trim(ThisItem.DisplayName), " ")) > 1, Left(Last(Split(Trim(ThisItem.DisplayName), " ")).Value, 1), ""))
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =Switch(Mod(Len(ThisItem.DisplayName) + 3 * Len(First(Split(Trim(ThisItem.DisplayName), " ")).Value), 6), 0, RGBA(124, 58, 237, 1), 1, RGBA(15, 108, 189, 1), 2, RGBA(13, 128, 118, 1), 3, RGBA(194, 41, 120, 1), 4, RGBA(188, 75, 9, 1), RGBA(16, 124, 16, 1))
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
            - icoChosenRemove:
                Control: ModernIcon@1.1.0
                Properties:
                  X: =galChosenRemove.X + (galChosenRemove.Width - 16) / 2
                  Y: =galChosenRemove.Y + (galChosenRemove.Height - 16) / 2
                  Width: =16
                  Height: =16
                  Visible: =galChosenRemove.Visible
                  Icon: ="Dismiss"
                  IconColor: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
                  IconStyle: =IconStyle.Outline
            - galChosenRemove:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =Parent.TemplateWidth - 38
                  Y: =6
                  Width: =28
                  Height: =28
                  Text: ="Remove " & ThisItem.DisplayName
                  Fill: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(0, 0, 0, 0)
                  BorderColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 0.08), RGBA(0, 0, 0, 0.05))
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 0.14), RGBA(0, 0, 0, 0.09))
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(0, 0, 0, 0)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  FocusedBorderColor: =If(lcsPeoplePicker.Theme = "Dark", ColorFade(lcsPeoplePicker.AccentColor, 0.45), lcsPeoplePicker.AccentColor)
                  FocusedBorderThickness: =2
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  OnSelect: |-
                    =If(
                        !locTouched,
                        ClearCollect(colPeople, lcsPeoplePicker.DefaultPeople);
                        Set(locTouched, true)
                    );
                    RemoveIf(colPeople, Lower(Mail) = Lower(ThisItem.Mail));
                    lcsPeoplePicker.OnChange(Concat(colPeople, Mail, ";"))
      - txtSearch:
          Control: ModernTextInput@1.0.0
          Properties:
            X: =0
            Y: =galChosen.Y + galChosen.Height + If(CountRows(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)) > 0, 6, 0)
            Width: =Parent.Width
            Height: =40
            Visible: =!(lcsPeoplePicker.MaxPeople > 0 && CountRows(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)) >= lcsPeoplePicker.MaxPeople)
            Placeholder: =lcsPeoplePicker.Placeholder
            Type: =TextInputType.Search
            TriggerOutput: =TriggerOutput.Delayed
            Appearance: =Appearance.Outline
            BasePaletteColor: =lcsPeoplePicker.AccentColor
            Size: =14
            Color: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
            Fill: =If(lcsPeoplePicker.Theme = "Dark", RGBA(41, 41, 41, 1), RGBA(255, 255, 255, 1))
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            ValidationState: =If(Left(lblMessage.Text, 1) = "⚠", ValidationState.Error, ValidationState.None)
            AccessibleLabel: |-
              =lcsPeoplePicker.Label & ", search people" &
                  If(CountRows(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)) > 0, ", " & CountRows(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)) & " chosen", "")
      - galResults:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            X: =0
            Y: =txtSearch.Y + txtSearch.Height + 6
            Width: =Parent.Width
            Height: =Min(4, CountRows(Self.AllItems)) * 48
            Visible: =!(lcsPeoplePicker.MaxPeople > 0 && CountRows(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)) >= lcsPeoplePicker.MaxPeople) && Len(Trim(txtSearch.Text)) >= Max(1, lcsPeoplePicker.MinSearchLength)
            Items: |-
              =Filter(
                  lcsPeoplePicker.Results As person,
                  IsBlank(LookUp(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople) As chosen, Lower(chosen.Mail) = Lower(person.Mail)))
              )
            TemplateSize: =48
            TemplatePadding: =0
            ShowScrollbar: =true
            BorderStyle: =BorderStyle.None
            AccessibleLabel: ="Search results"
          Children:
            - galResultsAvatar:
                Control: ModernText@1.0.0
                Properties:
                  X: =8
                  Y: =8
                  Width: =32
                  Height: =32
                  Text: =Upper(Left(Trim(ThisItem.DisplayName), 1) & If(CountRows(Split(Trim(ThisItem.DisplayName), " ")) > 1, Left(Last(Split(Trim(ThisItem.DisplayName), " ")).Value, 1), ""))
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =Switch(Mod(Len(ThisItem.DisplayName) + 3 * Len(First(Split(Trim(ThisItem.DisplayName), " ")).Value), 6), 0, RGBA(124, 58, 237, 1), 1, RGBA(15, 108, 189, 1), 2, RGBA(13, 128, 118, 1), 3, RGBA(194, 41, 120, 1), 4, RGBA(188, 75, 9, 1), RGBA(16, 124, 16, 1))
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
            - galResultsName:
                Control: ModernText@1.0.0
                Properties:
                  X: =52
                  Y: =6
                  Width: =Parent.TemplateWidth - 60
                  Height: =20
                  Text: =ThisItem.DisplayName
                  Size: =14
                  Color: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
                  Wrap: =false
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  FontWeight: =FontWeight.Semibold
            - galResultsDetail:
                Control: ModernText@1.0.0
                Properties:
                  X: =52
                  Y: =26
                  Width: =Parent.TemplateWidth - 60
                  Height: =16
                  Text: =If(IsBlank(ThisItem.JobTitle), ThisItem.Mail, ThisItem.JobTitle & " · " & ThisItem.Mail)
                  Size: =12
                  Color: =If(lcsPeoplePicker.Theme = "Dark", RGBA(173, 173, 173, 1), RGBA(97, 97, 97, 1))
                  Wrap: =false
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
            - galResultsPick:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  Text: ="Add " & ThisItem.DisplayName
                  Tooltip: =ThisItem.Mail
                  Fill: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(0, 0, 0, 0)
                  BorderColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 0.08), RGBA(0, 0, 0, 0.05))
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 0.08), RGBA(0, 0, 0, 0.05))
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: |-
                    =If(
                        !locTouched,
                        ClearCollect(colPeople, lcsPeoplePicker.DefaultPeople);
                        Set(locTouched, true)
                    );
                    If(
                        IsBlank(LookUp(colPeople, Lower(Mail) = Lower(ThisItem.Mail))) &&
                            !(lcsPeoplePicker.MaxPeople > 0 && CountRows(colPeople) >= lcsPeoplePicker.MaxPeople),
                        Collect(colPeople, {DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail, JobTitle: ThisItem.JobTitle})
                    );
                    Reset(txtSearch);
                    Set(locLastSearch, "");
                    lcsPeoplePicker.OnChange(Concat(colPeople, Mail, ";"))
      - lblSuggested:
          Control: ModernText@1.0.0
          Properties:
            X: =0
            Y: =txtSearch.Y + txtSearch.Height + 6
            Width: =Parent.Width
            Height: =18
            Visible: =galSuggested.Visible
            Text: ="Suggested"
            Size: =12
            FontWeight: =FontWeight.Semibold
            Color: =If(lcsPeoplePicker.Theme = "Dark", RGBA(173, 173, 173, 1), RGBA(97, 97, 97, 1))
            PaddingLeft: =8
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
      - galSuggested:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            X: =0
            Y: =lblSuggested.Y + 20
            Width: =Parent.Width
            Height: =Min(3, CountRows(Self.AllItems)) * 48
            Visible: =!(lcsPeoplePicker.MaxPeople > 0 && CountRows(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)) >= lcsPeoplePicker.MaxPeople) && IsBlank(Trim(txtSearch.Text)) && CountRows(Self.AllItems) > 0
            Items: |-
              =FirstN(Filter(
                  lcsPeoplePicker.Suggestions As person,
                  IsBlank(LookUp(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople) As chosen, Lower(chosen.Mail) = Lower(person.Mail)))
              ), 3)
            TemplateSize: =48
            TemplatePadding: =0
            ShowScrollbar: =true
            BorderStyle: =BorderStyle.None
            AccessibleLabel: ="Suggested people"
          Children:
            - galSuggestedAvatar:
                Control: ModernText@1.0.0
                Properties:
                  X: =8
                  Y: =8
                  Width: =32
                  Height: =32
                  Text: =Upper(Left(Trim(ThisItem.DisplayName), 1) & If(CountRows(Split(Trim(ThisItem.DisplayName), " ")) > 1, Left(Last(Split(Trim(ThisItem.DisplayName), " ")).Value, 1), ""))
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =Switch(Mod(Len(ThisItem.DisplayName) + 3 * Len(First(Split(Trim(ThisItem.DisplayName), " ")).Value), 6), 0, RGBA(124, 58, 237, 1), 1, RGBA(15, 108, 189, 1), 2, RGBA(13, 128, 118, 1), 3, RGBA(194, 41, 120, 1), 4, RGBA(188, 75, 9, 1), RGBA(16, 124, 16, 1))
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
            - galSuggestedName:
                Control: ModernText@1.0.0
                Properties:
                  X: =52
                  Y: =6
                  Width: =Parent.TemplateWidth - 60
                  Height: =20
                  Text: =ThisItem.DisplayName
                  Size: =14
                  Color: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
                  Wrap: =false
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  FontWeight: =FontWeight.Semibold
            - galSuggestedDetail:
                Control: ModernText@1.0.0
                Properties:
                  X: =52
                  Y: =26
                  Width: =Parent.TemplateWidth - 60
                  Height: =16
                  Text: =If(IsBlank(ThisItem.JobTitle), ThisItem.Mail, ThisItem.JobTitle & " · " & ThisItem.Mail)
                  Size: =12
                  Color: =If(lcsPeoplePicker.Theme = "Dark", RGBA(173, 173, 173, 1), RGBA(97, 97, 97, 1))
                  Wrap: =false
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
            - galSuggestedPick:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  Text: ="Add " & ThisItem.DisplayName
                  Tooltip: =ThisItem.Mail
                  Fill: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(0, 0, 0, 0)
                  BorderColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 0.08), RGBA(0, 0, 0, 0.05))
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =If(lcsPeoplePicker.Theme = "Dark", RGBA(255, 255, 255, 0.08), RGBA(0, 0, 0, 0.05))
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: |-
                    =If(
                        !locTouched,
                        ClearCollect(colPeople, lcsPeoplePicker.DefaultPeople);
                        Set(locTouched, true)
                    );
                    If(
                        IsBlank(LookUp(colPeople, Lower(Mail) = Lower(ThisItem.Mail))) &&
                            !(lcsPeoplePicker.MaxPeople > 0 && CountRows(colPeople) >= lcsPeoplePicker.MaxPeople),
                        Collect(colPeople, {DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail, JobTitle: ThisItem.JobTitle})
                    );
                    Reset(txtSearch);
                    Set(locLastSearch, "");
                    lcsPeoplePicker.OnChange(Concat(colPeople, Mail, ";"))
      - lblListMessage:
          Control: ModernText@1.0.0
          Properties:
            X: =0
            Y: =txtSearch.Y + txtSearch.Height + 6
            Width: =Parent.Width
            Height: =24
            Text: |-
              =Switch(
                  true,
                  (lcsPeoplePicker.MaxPeople > 0 && CountRows(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)) >= lcsPeoplePicker.MaxPeople), "",
                  Len(Trim(txtSearch.Text)) > 0 && !(Len(Trim(txtSearch.Text)) >= Max(1, lcsPeoplePicker.MinSearchLength)),
                      "Type at least " & lcsPeoplePicker.MinSearchLength & " characters to search.",
                  Len(Trim(txtSearch.Text)) >= Max(1, lcsPeoplePicker.MinSearchLength) && locLastSearch = Trim(txtSearch.Text) && CountRows(galResults.AllItems) = 0,
                      If(
                          CountRows(lcsPeoplePicker.Results) > 0,
                          "Everyone found is already chosen.",
                          "No one found for " & Char(34) & Trim(txtSearch.Text) & Char(34) & "."
                      ),
                  ""
              )
            Size: =13
            Color: =If(lcsPeoplePicker.Theme = "Dark", RGBA(173, 173, 173, 1), RGBA(97, 97, 97, 1))
            PaddingLeft: =8
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
      - lblMessage:
          Control: ModernText@1.0.0
          Properties:
            X: =0
            Y: =Parent.Height - 20
            Width: =Parent.Width
            Height: =20
            Text: |-
              =With(
                  {problem: If(locTouched, If(lcsPeoplePicker.Required && CountRows(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)) = 0, "Choose at least one person.", ""), "")},
                  Switch(
                      true,
                      !IsBlank(problem), "⚠ " & problem,
                      (lcsPeoplePicker.MaxPeople > 0 && CountRows(If(locTouched, colPeople, lcsPeoplePicker.DefaultPeople)) >= lcsPeoplePicker.MaxPeople) && lcsPeoplePicker.MaxPeople > 1,
                          "That's the most this field allows (" & lcsPeoplePicker.MaxPeople & ").",
                      lcsPeoplePicker.Hint
                  )
              )
            Size: =12
            Color: =If(Left(Self.Text, 1) = "⚠", If(lcsPeoplePicker.Theme = "Dark", RGBA(241, 112, 123, 1), RGBA(196, 49, 75, 1)), If(lcsPeoplePicker.Theme = "Dark", RGBA(173, 173, 173, 1), RGBA(97, 97, 97, 1)))
            Wrap: =false
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
