ComponentDefinitions:
  lcsNavShell:
    DefinitionType: CanvasComponent
    Description: "LowCodeStacks navigation shell: a side menu on wide screens and a bottom bar on phones, from one items table, with badges, items hidden or disabled by key, the current screen from your app, and a collapse state as an output."
    CustomProperties:
      Items:
        PropertyKind: Input
        DisplayName: Items
        DataType: Table
        Description: "The menu, in order: Key (your own id for the item), Label, Icon (a Fluent icon name, such as Home) and Badge (text such as 3, or blank)."
        Default: |-
          =Table(
              {Key: "home", Label: "Home", Icon: "Home", Badge: ""},
              {Key: "orders", Label: "Orders", Icon: "Cart", Badge: "3"},
              {Key: "customers", Label: "Customers", Icon: "People", Badge: ""},
              {Key: "reports", Label: "Reports", Icon: "Document", Badge: ""},
              {Key: "settings", Label: "Settings", Icon: "Settings", Badge: ""}
          )
      Title:
        PropertyKind: Input
        DisplayName: Title
        DataType: Text
        Description: "Your app's name, at the top of the side menu."
        Default: ="My app"
      CurrentKey:
        PropertyKind: Input
        DisplayName: CurrentKey
        DataType: Text
        Description: "The Key of the screen the user is on, from your app, so the menu marks it. Leave it blank and the menu marks the item last selected."
        Default: =""
      HiddenKeys:
        PropertyKind: Input
        DisplayName: HiddenKeys
        DataType: Text
        Description: "Keys of items to hide, separated by commas, such as for a role."
        Default: =""
      DisabledKeys:
        PropertyKind: Input
        DisplayName: DisabledKeys
        DataType: Text
        Description: "Keys of items to show but not allow, separated by commas."
        Default: =""
      StartCollapsed:
        PropertyKind: Input
        DisplayName: StartCollapsed
        DataType: Boolean
        Description: "Starts the side menu collapsed to its icons."
        Default: =false
      ScreenWidth:
        PropertyKind: Input
        DisplayName: ScreenWidth
        DataType: Number
        Description: "The width of your screen. Set it to Parent.Width, so the menu becomes a bottom bar on phones."
        Default: =1366
      ScreenHeight:
        PropertyKind: Input
        DisplayName: ScreenHeight
        DataType: Number
        Description: "The height of your screen. Set it to Parent.Height."
        Default: =768
      BottomBarBelow:
        PropertyKind: Input
        DisplayName: BottomBarBelow
        DataType: Number
        Description: "Below this screen width, the menu is a bottom bar."
        Default: =640
      MaxBottomItems:
        PropertyKind: Input
        DisplayName: MaxBottomItems
        DataType: Number
        Description: "How many items the bottom bar shows, from the top of the list."
        Default: =5
      ExpandedWidth:
        PropertyKind: Input
        DisplayName: ExpandedWidth
        DataType: Number
        Description: "The width of the side menu when it isn't collapsed."
        Default: =240
      ShowToggle:
        PropertyKind: Input
        DisplayName: ShowToggle
        DataType: Boolean
        Description: "Shows the button that collapses and expands the side menu."
        Default: =true
      MenuLabel:
        PropertyKind: Input
        DisplayName: MenuLabel
        DataType: Text
        Description: "What screen readers call the menu."
        Default: ="Main menu"
      CollapseText:
        PropertyKind: Input
        DisplayName: CollapseText
        DataType: Text
        Description: "The collapse button's name, read out and shown on hover."
        Default: ="Collapse the menu"
      ExpandText:
        PropertyKind: Input
        DisplayName: ExpandText
        DataType: Text
        Description: "The expand button's name, read out and shown on hover."
        Default: ="Expand the menu"
      ShowUser:
        PropertyKind: Input
        DisplayName: ShowUser
        DataType: Boolean
        Description: "Shows who is signed in at the bottom of the side menu."
        Default: =true
      UserName:
        PropertyKind: Input
        DisplayName: UserName
        DataType: Text
        Description: "The signed-in person's name, such as User().FullName. The avatar shows their initials when there's no picture."
        Default: ="Avery Brooks"
      UserDetail:
        PropertyKind: Input
        DisplayName: UserDetail
        DataType: Text
        Description: "A line under the name, such as their role or User().Email."
        Default: ="Admin"
      UserImage:
        PropertyKind: Input
        DisplayName: UserImage
        DataType: Image
        Description: "The person's picture, such as User().Image. Leave it blank for initials."
        Default: =""
      ShowThemeToggle:
        PropertyKind: Input
        DisplayName: ShowThemeToggle
        DataType: Boolean
        Description: "Shows the sun and moon button that switches between light and dark."
        Default: =true
      DarkText:
        PropertyKind: Input
        DisplayName: DarkText
        DataType: Text
        Description: "The theme button's name in light mode, read out and shown on hover."
        Default: ="Switch to dark theme"
      LightText:
        PropertyKind: Input
        DisplayName: LightText
        DataType: Text
        Description: "The theme button's name in dark mode."
        Default: ="Switch to light theme"
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        DataType: Color
        Description: "Your brand colour, for the current item and badges."
        Default: =RGBA(15, 108, 189, 1)
      Theme:
        PropertyKind: Input
        DisplayName: Theme
        DataType: Text
        Description: "Light, or Dark for a dark app. The theme button changes it inside the menu; keep your app in step with OnThemeChange."
        Default: ="Light"
      IsCollapsed:
        PropertyKind: Output
        DisplayName: IsCollapsed
        DataType: Boolean
        Description: "True while the side menu is collapsed to its icons."
      IsBottomBar:
        PropertyKind: Output
        DisplayName: IsBottomBar
        DataType: Boolean
        Description: "True while the menu is a bottom bar, on a narrow screen."
      SelectedKey:
        PropertyKind: Output
        DisplayName: SelectedKey
        DataType: Text
        Description: "The Key of the item the menu marks as current."
      CurrentTheme:
        PropertyKind: Output
        DisplayName: CurrentTheme
        DataType: Text
        Description: "Light or Dark: the Theme input, or what the theme button chose."
      ShellX:
        PropertyKind: Output
        DisplayName: ShellX
        DataType: Number
        Description: "Set the component's X to this."
      ShellY:
        PropertyKind: Output
        DisplayName: ShellY
        DataType: Number
        Description: "Set the component's Y to this."
      ShellWidth:
        PropertyKind: Output
        DisplayName: ShellWidth
        DataType: Number
        Description: "Set the component's Width to this."
      ShellHeight:
        PropertyKind: Output
        DisplayName: ShellHeight
        DataType: Number
        Description: "Set the component's Height to this."
      ContentX:
        PropertyKind: Output
        DisplayName: ContentX
        DataType: Number
        Description: "Where your screen's content starts, from the left."
      ContentY:
        PropertyKind: Output
        DisplayName: ContentY
        DataType: Number
        Description: "Where your screen's content starts, from the top."
      ContentWidth:
        PropertyKind: Output
        DisplayName: ContentWidth
        DataType: Number
        Description: "How wide your screen's content can be."
      ContentHeight:
        PropertyKind: Output
        DisplayName: ContentHeight
        DataType: Number
        Description: "How tall your screen's content can be."
      OnNavigate:
        PropertyKind: Event
        DisplayName: OnNavigate
        ReturnType: None
        Description: "Runs when the user selects an item. Go to its screen here with Navigate, using ItemKey to choose the screen."
        Parameters:
          - ItemKey:
              DataType: Text
              Description: "The Key of the item selected."
              Default: =""
        Default: =false
      OnToggle:
        PropertyKind: Event
        DisplayName: OnToggle
        ReturnType: None
        Description: "Runs when the user collapses or expands the side menu."
        Parameters:
          - Collapsed:
              DataType: Boolean
              Description: "True when the menu is now collapsed."
              Default: =false
        Default: =false
      OnThemeChange:
        PropertyKind: Event
        DisplayName: OnThemeChange
        ReturnType: None
        Description: "Runs when the user switches between light and dark. Set your app's theme here."
        Parameters:
          - NewTheme:
              DataType: Text
              Description: "Light or Dark: the theme now chosen."
              Default: ="Light"
        Default: =false
      OnUserSelect:
        PropertyKind: Event
        DisplayName: OnUserSelect
        ReturnType: None
        Description: "Runs when the user selects their avatar. Open their profile or a sign-out choice here."
        Default: =false
      SetCollapsed:
        PropertyKind: Action
        DisplayName: SetCollapsed
        ReturnType: None
        Description: "Collapses or expands the side menu, such as SetCollapsed(true) on a small tablet."
        Parameters:
          - Collapsed:
              DataType: Boolean
              Description: "True to collapse it, false to expand it."
              Default: =false
    Properties:
      Width: =240
      Height: =640
      Fill: =RGBA(0, 0, 0, 0)
      IsCollapsed: =Coalesce(locCollapsed, lcsNavShell.StartCollapsed)
      IsBottomBar: =(lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow)
      CurrentTheme: =Coalesce(locTheme, lcsNavShell.Theme)
      SelectedKey: =Coalesce(lcsNavShell.CurrentKey, locSelected, First(Filter(lcsNavShell.Items As item, !(item.Key in ForAll(Split(lcsNavShell.HiddenKeys, ","), Trim(ThisRecord.Value))))).Key)
      ShellX: =0
      ShellY: =If((lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow), lcsNavShell.ScreenHeight - 64, 0)
      ShellWidth: =If((lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow), lcsNavShell.ScreenWidth, If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), 64, lcsNavShell.ExpandedWidth))
      ShellHeight: =If((lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow), 64, lcsNavShell.ScreenHeight)
      ContentX: =If((lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow), 0, If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), 64, lcsNavShell.ExpandedWidth))
      ContentY: =0
      ContentWidth: =If((lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow), lcsNavShell.ScreenWidth, lcsNavShell.ScreenWidth - If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), 64, lcsNavShell.ExpandedWidth))
      ContentHeight: =If((lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow), lcsNavShell.ScreenHeight - 64, lcsNavShell.ScreenHeight)
      SetCollapsed: =Set(locCollapsed, Collapsed)
    Children:
      - shpSide:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), 64, lcsNavShell.ExpandedWidth)
            Height: =Parent.Height
            Visible: =!(lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow)
            Fill: =If(Coalesce(locTheme, lcsNavShell.Theme) = "Dark", RGBA(32, 32, 32, 1), RGBA(250, 250, 250, 1))
      - shpSideEdge:
          Control: Rectangle@2.3.0
          Properties:
            X: =If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), 64, lcsNavShell.ExpandedWidth) - 1
            Y: =0
            Width: =1
            Height: =Parent.Height
            Visible: =!(lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow)
            Fill: =If(Coalesce(locTheme, lcsNavShell.Theme) = "Dark", RGBA(66, 66, 66, 1), RGBA(229, 231, 235, 1))
      - btnToggle:
          Control: ModernButton@1.0.0
          Properties:
            X: =12
            Y: =12
            Width: =40
            Height: =40
            Visible: =!(lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow) && lcsNavShell.ShowToggle
            Text: =If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), lcsNavShell.ExpandText, lcsNavShell.CollapseText)
            Icon: ="Navigation"
            Layout: =ButtonLayout.IconOnly
            Appearance: =ButtonAppearance.Subtle
            Color: =If(Coalesce(locTheme, lcsNavShell.Theme) = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
            AccessibleLabel: =If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), lcsNavShell.ExpandText, lcsNavShell.CollapseText)
            Tooltip: =If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), lcsNavShell.ExpandText, lcsNavShell.CollapseText)
            OnSelect: |-
              =With(
                  {next: !Coalesce(locCollapsed, lcsNavShell.StartCollapsed)},
                  Set(locCollapsed, next);
                  lcsNavShell.OnToggle(next)
              )
      - lblTitle:
          Control: ModernText@1.0.0
          Properties:
            X: =If(lcsNavShell.ShowToggle, 60, 20)
            Y: =12
            Width: =If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), 64, lcsNavShell.ExpandedWidth) - If(lcsNavShell.ShowToggle, 72, 32)
            Height: =40
            Visible: =!(lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow) && !Coalesce(locCollapsed, lcsNavShell.StartCollapsed)
            Text: =lcsNavShell.Title
            Size: =16
            Color: =If(Coalesce(locTheme, lcsNavShell.Theme) = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =false
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
            FontWeight: =FontWeight.Semibold
      - galSide:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            X: =8
            Y: =64
            Width: =If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), 64, lcsNavShell.ExpandedWidth) - 16
            Height: =Parent.Height - 72 - If((lcsNavShell.ShowUser || lcsNavShell.ShowThemeToggle), If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed) && lcsNavShell.ShowUser && lcsNavShell.ShowThemeToggle, 120, 72), 0)
            Visible: =!(lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow)
            Items: =Filter(lcsNavShell.Items As item, !(item.Key in ForAll(Split(lcsNavShell.HiddenKeys, ","), Trim(ThisRecord.Value))))
            TemplateSize: =44
            TemplatePadding: =2
            ShowScrollbar: =false
            BorderStyle: =BorderStyle.None
            AccessibleLabel: =lcsNavShell.MenuLabel
          Children:
            - shpCurrent:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  Visible: =ThisItem.Key = Coalesce(lcsNavShell.CurrentKey, locSelected, First(Filter(lcsNavShell.Items As item, !(item.Key in ForAll(Split(lcsNavShell.HiddenKeys, ","), Trim(ThisRecord.Value))))).Key)
                  Fill: =ColorFade(lcsNavShell.AccentColor, If(Coalesce(locTheme, lcsNavShell.Theme) = "Dark", -0.55, 0.86))
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
            - shpCurrentBar:
                Control: Rectangle@2.3.0
                Properties:
                  X: =0
                  Y: =12
                  Width: =3
                  Height: =Parent.TemplateHeight - 24
                  Visible: =ThisItem.Key = Coalesce(lcsNavShell.CurrentKey, locSelected, First(Filter(lcsNavShell.Items As item, !(item.Key in ForAll(Split(lcsNavShell.HiddenKeys, ","), Trim(ThisRecord.Value))))).Key)
                  Fill: =lcsNavShell.AccentColor
            - lblBadge:
                Control: ModernText@1.0.0
                Properties:
                  X: =Parent.TemplateWidth - Max(22, Len(ThisItem.Badge) * 8 + 14) - 10
                  Y: =(Parent.TemplateHeight - 22) / 2
                  Width: =Max(22, Len(ThisItem.Badge) * 8 + 14)
                  Height: =22
                  Visible: =!IsBlank(ThisItem.Badge) && !Coalesce(locCollapsed, lcsNavShell.StartCollapsed)
                  Text: =ThisItem.Badge
                  Size: =11
                  Color: =RGBA(255, 255, 255, 1)
                  VerticalAlign: =VerticalAlign.Middle
                  Wrap: =false
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Center
                  Fill: =lcsNavShell.AccentColor
                  RadiusTopLeft: =11
                  RadiusTopRight: =11
                  RadiusBottomLeft: =11
                  RadiusBottomRight: =11
            - lblBadgeDot:
                Control: ModernText@1.0.0
                Properties:
                  X: =30
                  Y: =4
                  Width: =Max(16, Len(ThisItem.Badge) * 7 + 8)
                  Height: =16
                  Visible: =!IsBlank(ThisItem.Badge) && Coalesce(locCollapsed, lcsNavShell.StartCollapsed)
                  Text: =ThisItem.Badge
                  Size: =9
                  Color: =RGBA(255, 255, 255, 1)
                  VerticalAlign: =VerticalAlign.Middle
                  Wrap: =false
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Center
                  Fill: =lcsNavShell.AccentColor
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
            - btnItem:
                Control: ModernButton@1.0.0
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  Text: =ThisItem.Label
                  Icon: =ThisItem.Icon
                  IconStyle: =If(ThisItem.Key = Coalesce(lcsNavShell.CurrentKey, locSelected, First(Filter(lcsNavShell.Items As item, !(item.Key in ForAll(Split(lcsNavShell.HiddenKeys, ","), Trim(ThisRecord.Value))))).Key), IconStyle.Filled, IconStyle.Outline)
                  Layout: =If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                  Align: =If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), Align.Center, Align.Left)
                  PaddingLeft: =If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), 0, 14)
                  Appearance: =ButtonAppearance.Transparent
                  Color: =If(ThisItem.Key = Coalesce(lcsNavShell.CurrentKey, locSelected, First(Filter(lcsNavShell.Items As item, !(item.Key in ForAll(Split(lcsNavShell.HiddenKeys, ","), Trim(ThisRecord.Value))))).Key), If(Coalesce(locTheme, lcsNavShell.Theme) = "Dark", RGBA(255, 255, 255, 1), ColorFade(lcsNavShell.AccentColor, -0.25)), If(Coalesce(locTheme, lcsNavShell.Theme) = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1)))
                  FontWeight: =If(ThisItem.Key = Coalesce(lcsNavShell.CurrentKey, locSelected, First(Filter(lcsNavShell.Items As item, !(item.Key in ForAll(Split(lcsNavShell.HiddenKeys, ","), Trim(ThisRecord.Value))))).Key), FontWeight.Semibold, FontWeight.Normal)
                  Size: =14
                  DisplayMode: =If(ThisItem.Key in ForAll(Split(lcsNavShell.DisabledKeys, ","), Trim(ThisRecord.Value)), DisplayMode.Disabled, DisplayMode.Edit)
                  AccessibleLabel: =ThisItem.Label & If(IsBlank(ThisItem.Badge), "", ", " & ThisItem.Badge)
                  Tooltip: =If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), ThisItem.Label, "")
                  OnSelect: |-
                    =Set(locSelected, ThisItem.Key);
                    lcsNavShell.OnNavigate(ThisItem.Key)
      - shpFooterLine:
          Control: Rectangle@2.3.0
          Properties:
            X: =12
            Y: =Parent.Height - If((lcsNavShell.ShowUser || lcsNavShell.ShowThemeToggle), If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed) && lcsNavShell.ShowUser && lcsNavShell.ShowThemeToggle, 120, 72), 0)
            Width: =Max(0, If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), 64, lcsNavShell.ExpandedWidth) - 24)
            Height: =1
            Visible: =!(lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow) && (lcsNavShell.ShowUser || lcsNavShell.ShowThemeToggle)
            Fill: =If(Coalesce(locTheme, lcsNavShell.Theme) = "Dark", RGBA(66, 66, 66, 1), RGBA(229, 231, 235, 1))
      - avUser:
          Control: ModernAvatar@1.0.0
          Properties:
            X: =16
            Y: =Parent.Height - If((lcsNavShell.ShowUser || lcsNavShell.ShowThemeToggle), If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed) && lcsNavShell.ShowUser && lcsNavShell.ShowThemeToggle, 120, 72), 0) + 20
            Width: =32
            Height: =32
            Visible: =!(lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow) && lcsNavShell.ShowUser
            Name: =lcsNavShell.UserName
            Image: =lcsNavShell.UserImage
            Appearance: ="Colorful"
            AccessibleLabel: =lcsNavShell.UserName & If(IsBlank(lcsNavShell.UserDetail), "", ", " & lcsNavShell.UserDetail)
            Tooltip: =lcsNavShell.UserName
            OnSelect: =lcsNavShell.OnUserSelect()
      - lblUserName:
          Control: ModernText@1.0.0
          Properties:
            X: =56
            Y: =Parent.Height - If((lcsNavShell.ShowUser || lcsNavShell.ShowThemeToggle), If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed) && lcsNavShell.ShowUser && lcsNavShell.ShowThemeToggle, 120, 72), 0) + 20 - 1
            Width: =Max(0, If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), 64, lcsNavShell.ExpandedWidth) - 56 - If(lcsNavShell.ShowThemeToggle, 60, 12))
            Height: =18
            Visible: =!(lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow) && lcsNavShell.ShowUser && !Coalesce(locCollapsed, lcsNavShell.StartCollapsed)
            Text: =lcsNavShell.UserName
            Size: =13
            Color: =If(Coalesce(locTheme, lcsNavShell.Theme) = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =false
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
            FontWeight: =FontWeight.Semibold
      - lblUserDetail:
          Control: ModernText@1.0.0
          Properties:
            X: =56
            Y: =Parent.Height - If((lcsNavShell.ShowUser || lcsNavShell.ShowThemeToggle), If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed) && lcsNavShell.ShowUser && lcsNavShell.ShowThemeToggle, 120, 72), 0) + 20 + 17
            Width: =Max(0, If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), 64, lcsNavShell.ExpandedWidth) - 56 - If(lcsNavShell.ShowThemeToggle, 60, 12))
            Height: =16
            Visible: =!(lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow) && lcsNavShell.ShowUser && !Coalesce(locCollapsed, lcsNavShell.StartCollapsed)
            Text: =lcsNavShell.UserDetail
            Size: =11
            Color: =If(Coalesce(locTheme, lcsNavShell.Theme) = "Dark", RGBA(173, 173, 173, 1), RGBA(97, 97, 97, 1))
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =false
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
      - imgTheme:
          Control: Image@2.2.3
          Properties:
            X: =If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), 12, If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed), 64, lcsNavShell.ExpandedWidth) - 52) + 8
            Y: =If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed) && lcsNavShell.ShowUser, Parent.Height - If((lcsNavShell.ShowUser || lcsNavShell.ShowThemeToggle), If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed) && lcsNavShell.ShowUser && lcsNavShell.ShowThemeToggle, 120, 72), 0) + 68, Parent.Height - If((lcsNavShell.ShowUser || lcsNavShell.ShowThemeToggle), If(Coalesce(locCollapsed, lcsNavShell.StartCollapsed) && lcsNavShell.ShowUser && lcsNavShell.ShowThemeToggle, 120, 72), 0) + 16) + 8
            Width: =24
            Height: =24
            Visible: =!(lcsNavShell.ScreenWidth < lcsNavShell.BottomBarBelow) && lcsNavShell.ShowThemeToggle
            Image: |-
