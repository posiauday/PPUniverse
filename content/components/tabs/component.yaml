ComponentDefinitions:
  lcsTabs:
    DefinitionType: CanvasComponent
    Description: "LowCodeStacks tabs: the modern tab list with counts on tabs, tabs hidden by name, a selected-tab output, a change event, a select action and four looks, for tabs or a segmented control."
    CustomProperties:
      Items:
        PropertyKind: Input
        DisplayName: Items
        DataType: Table
        Description: "The tabs, as a one-column table of text, such as [\"Overview\", \"Details\", \"History\"]."
        Default: =["Overview", "Details", "History"]
      DefaultTab:
        PropertyKind: Input
        DisplayName: DefaultTab
        DataType: Text
        Description: "The tab selected when the screen loads. It must be one of Items."
        Default: ="Overview"
      Look:
        PropertyKind: Input
        DisplayName: Look
        DataType: Text
        Description: "Underline (tabs), Filled (segmented control), Subtle or Transparent."
        Default: ="Underline"
      AccessibleName:
        PropertyKind: Input
        DisplayName: AccessibleName
        DataType: Text
        Description: "What the tabs switch between, for screen readers, such as Request sections."
        Default: ="Sections"
      Counts:
        PropertyKind: Input
        DisplayName: Counts
        DataType: Table
        Description: "Numbers to show on tabs, as a table with Tab and Count columns, such as Table({Tab: \"Open\", Count: 3}). A tab with 0 shows no number."
        Default: |-
          =Table({Tab: "", Count: 0})
      HiddenTabs:
        PropertyKind: Input
        DisplayName: HiddenTabs
        DataType: Text
        Description: "Tabs to leave out, by name, separated by commas, such as \"History\" for people who can't see it."
        Default: =""
      SelectedTab:
        PropertyKind: Output
        DisplayName: SelectedTab
        DataType: Text
        Description: "The text of the selected tab. Use it to show the matching content."
      ItemsFromText:
        PropertyKind: OutputFunction
        DisplayName: ItemsFromText
        DataType: Table
        Description: "Turns comma-separated text, such as \"Open, Waiting, Done\", into tabs for Items."
        Parameters:
          - List:
              DataType: Text
              Description: "The tab names, separated by commas."
              Default: =""
      OnChange:
        PropertyKind: Event
        DisplayName: OnChange
        ReturnType: None
        Description: "Runs in the app when the user picks a different tab. Receives the new tab's text."
        Parameters:
          - Tab:
              DataType: Text
              Description: "The newly selected tab."
              Default: =""
        Default: =false
      SelectTab:
        PropertyKind: Action
        DisplayName: SelectTab
        ReturnType: None
        Description: "Selects a tab from your app, such as after saving. It must be one of Items."
        Parameters:
          - Tab:
              DataType: Text
              Description: "The tab to select."
              Default: =""
    Properties:
      Width: =480
      Height: =48
      Fill: =RGBA(0, 0, 0, 0)
      SelectedTab: |-
        =With(
            {shown: tabList.Selected.Value},
            Coalesce(
                LookUp(
                    ForAll(lcsTabs.Items As tab, {Tab: tab.Value, Shown: tab.Value & With({n: LookUp(lcsTabs.Counts As c, c.Tab = tab.Value, c.Count)}, If(n > 0, " (" & n & ")", ""))}),
                    Shown = shown
                ).Tab,
                shown
            )
        )
      ItemsFromText: =ForAll(Split(List, ","), Trim(ThisRecord.Value))
      SelectTab: |-
        =Set(locTab, Tab);
        Reset(tabList)
    Children:
      - tabList:
          Control: ModernTabList@1.0.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Items: |-
              =ForAll(
                  Filter(lcsTabs.Items As tab, !(tab.Value in ForAll(Split(lcsTabs.HiddenTabs, ","), Trim(ThisRecord.Value)))) As tab,
                  tab.Value & With({n: LookUp(lcsTabs.Counts As c, c.Tab = tab.Value, c.Count)}, If(n > 0, " (" & n & ")", ""))
              )
            Default: |-
              =With(
                  {want: Coalesce(locTab, lcsTabs.DefaultTab)},
                  want & With({n: LookUp(lcsTabs.Counts As c, c.Tab = want, c.Count)}, If(n > 0, " (" & n & ")", ""))
              )
            Appearance: |-
              =Switch(
                  lcsTabs.Look,
                  "Filled", TabListAppearance.Filled,
                  "Subtle", TabListAppearance.Subtle,
                  "Transparent", TabListAppearance.Transparent,
                  TabListAppearance.Underline
              )
            Alignment: =TabListAlignment.Start
            AccessibleLabel: =lcsTabs.AccessibleName
            OnChange: |-
              =Set(locTab, lcsTabs.SelectedTab);
              lcsTabs.OnChange(locTab)
