ComponentDefinitions:
  lcsTabs:
    DefinitionType: CanvasComponent
    Description: "LowCodeStacks tabs: the modern tab list with a selected-tab output, a change event, a select action and four looks, for tabs or a segmented control."
    CustomProperties:
      Items:
        PropertyKind: Input
        DataType: Table
        Description: "The tabs, as a one-column table of text, such as [\"Overview\", \"Details\", \"History\"]."
        Default: =["Overview", "Details", "History"]
      DefaultTab:
        PropertyKind: Input
        DataType: Text
        Description: "The tab selected when the screen loads. It must be one of Items."
        Default: ="Overview"
      Look:
        PropertyKind: Input
        DataType: Text
        Description: "Underline (tabs), Filled (segmented control), Subtle or Transparent."
        Default: ="Underline"
      AccessibleName:
        PropertyKind: Input
        DataType: Text
        Description: "What the tabs switch between, for screen readers, such as Request sections."
        Default: ="Sections"
      SelectedTab:
        PropertyKind: Output
        DataType: Text
        Description: "The text of the selected tab. Use it to show the matching content."
      ItemsFromText:
        PropertyKind: OutputFunction
        DataType: Table
        Description: "Turns comma-separated text, such as \"Open, Waiting, Done\", into tabs for Items."
        Parameters:
          - List:
              DataType: Text
              Description: "The tab names, separated by commas."
      OnChange:
        PropertyKind: Event
        ReturnType: None
        Description: "Runs in the app when the user picks a different tab. Receives the new tab's text."
        Parameters:
          - Tab:
              DataType: Text
              Description: "The newly selected tab."
        Default: =false
      SelectTab:
        PropertyKind: Action
        ReturnType: None
        Description: "Selects a tab from your app, such as after saving. It must be one of Items."
        Parameters:
          - Tab:
              DataType: Text
              Description: "The tab to select."
    Properties:
      Width: =480
      Height: =48
      Fill: =RGBA(0, 0, 0, 0)
      SelectedTab: =tabList.Selected.Value
      ItemsFromText: =ForAll(Split(List, ","), Trim(ThisRecord.Value))
      SelectTab: |-
        =Set(locTab, Tab);
        Reset(tabList)
    Children:
      - tabList:
          Control: ModernTabList@1.0.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Items: =lcsTabs.Items
            Default: =Coalesce(locTab, lcsTabs.DefaultTab)
            Appearance: |-
              =Switch(
                  lcsTabs.Look,
                  "Filled", TabListAppearance.Filled,
                  "Subtle", TabListAppearance.Subtle,
                  "Transparent", TabListAppearance.Transparent,
                  TabListAppearance.Underline
              )
            Alignment: =TabListAlignment.Start
            AccessibleLabel: =lcsTabs.AccessibleName
            OnChange: =lcsTabs.OnChange(Self.Selected.Value)
