services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ppuniverse
      POSTGRES_PASSWORD: ppuniverse
      POSTGRES_DB: ppuniverse
    ports:
      - "5432:5432"
    volumes:
      - ppuniverse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppuniverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # bitnami/minio runs in server mode via env vars alone (no command
    # override needed) so the same image works as a GitHub Actions service
    # container too (.github/workflows/ci.yml), which doesn't support
    # overriding a service's command.
    image: bitnami/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Disable the embedded web console: a known bitnami/minio bug
      # ("Specified port is already in use" on the console port, see
      # bitnami/containers#30684) can prevent the container starting. The
      # app only ever uses the S3 API port (9000), never the console.
      MINIO_BROWSER: "off"
    ports:
      - "9000:9000"
    volumes:
      - ppuniverse-minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - ppuniverse-clamav:/var/lib/clamav
    healthcheck:
      # clamdcheck.sh is clamd's own bundled health-check script (avoids
      # depending on netcat, which is not guaranteed present in this image).
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  ppuniverse-postgres:
  ppuniverse-minio:
  ppuniverse-clamav:
