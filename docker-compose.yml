services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ppuniverse
      POSTGRES_PASSWORD: ppuniverse
      POSTGRES_DB: ppuniverse
    ports:
      - "5432:5432"
    volumes:
      - ppuniverse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppuniverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # bitnami/minio runs in server mode via env vars alone (no command
    # override needed) so the same image works as a GitHub Actions service
    # container too (.github/workflows/ci.yml), which doesn't support
    # overriding a service's command.
    image: bitnami/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - ppuniverse-minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - ppuniverse-clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 3 localhost 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  ppuniverse-postgres:
  ppuniverse-minio:
  ppuniverse-clamav:
