name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ppuniverse
          POSTGRES_PASSWORD: ppuniverse
          POSTGRES_DB: ppuniverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppuniverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        # bitnami/minio:latest no longer exists on Docker Hub (Bitnami moved
        # free/frozen images to the bitnamilegacy org — confirmed via the
        # Docker Hub API after the first real CI run failed with "manifest
        # unknown"). bitnamilegacy/minio:latest is the working equivalent.
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          # Disable the embedded web console: a known bitnami/minio bug
          # ("Specified port is already in use" on the console port, see
          # bitnami/containers#30684) prevents the container starting in
          # some versions of the GitHub Actions service-container context.
          # The app only ever uses the S3 API port (9000), never the
          # console, so disabling it removes that failure path entirely.
          MINIO_BROWSER: "off"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 120s
    env:
      DATABASE_URL: postgresql://ppuniverse:ppuniverse@localhost:5432/ppuniverse?schema=public
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: ppuniverse-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      CLAMAV_HOST: localhost
      CLAMAV_PORT: 3310
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations (integration test database)
        run: pnpm --filter @ppu/db exec prisma migrate deploy

      - name: Test (unit + integration)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  accessibility:
    name: Accessibility (axe + Playwright)
    # A separate job, in parallel with build-and-test (MVP-023, decision Q39). It runs the
    # accessibility suite on Playwright's pinned chromium, firefox and webkit builds at
    # 320/375/768/1280 px. Ceiling: 10 minutes wall-clock; if it is ever exceeded the answer
    # is a new decision (sharding, trimming, a scheduled full run), never dropping engines,
    # widths or rules.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ppuniverse
          POSTGRES_PASSWORD: ppuniverse
          POSTGRES_DB: ppuniverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppuniverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ppuniverse:ppuniverse@localhost:5432/ppuniverse?schema=public
      # The harness writes temporary rows (reserved prefix, deleted afterwards) to this
      # throwaway service container only, and its guard refuses any other database.
      E2E_ALLOW_DATABASE_WRITES: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Start the job clock
        run: echo "PPU_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: |
          start=$(date +%s)
          pnpm install --frozen-lockfile
          echo "PPU_SECONDS_DEPS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Read the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/e2e/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      # The browsers are Playwright's bundled builds, fixed by the exact pinned version, so
      # keying the cache on that version cannot let a browser drift.
      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers and system dependencies
        run: |
          start=$(date +%s)
          pnpm --filter @ppu/e2e exec playwright install --with-deps chromium firefox webkit
          echo "PPU_SECONDS_BROWSERS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "PPU_BROWSER_CACHE=${{ steps.browser-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: pnpm --filter @ppu/db exec prisma migrate deploy

      - name: Build the application
        run: |
          start=$(date +%s)
          pnpm build
          echo "PPU_SECONDS_BUILD=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Run the accessibility suite
        run: |
          start=$(date +%s)
          status=0
          pnpm test:a11y || status=$?
          echo "PPU_SECONDS_TESTS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit "$status"

      - name: Job summary (timing and results)
        if: always()
        run: |
          now=$(date +%s)
          {
            echo "## Accessibility gate"
            echo
            echo "### Timing, measured in this job"
            echo
            echo "| Phase | Seconds |"
            echo "|---|---|"
            echo "| Dependencies install (pnpm) | ${PPU_SECONDS_DEPS:-n/a} |"
            echo "| Browsers and system dependencies (browser cache: ${PPU_BROWSER_CACHE:-n/a}) | ${PPU_SECONDS_BROWSERS:-n/a} |"
            echo "| Application build | ${PPU_SECONDS_BUILD:-n/a} |"
            echo "| Test execution (includes starting the application server) | ${PPU_SECONDS_TESTS:-n/a} |"
            echo "| From the first step to this one (excludes runner start-up) | $(( now - ${PPU_JOB_START:-now} )) |"
            echo
            if [ -f packages/e2e/results/summary.md ]; then cat packages/e2e/results/summary.md; else echo "No test summary was produced."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/results
            packages/e2e/test-results
          retention-days: 14
          if-no-files-found: warn

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
