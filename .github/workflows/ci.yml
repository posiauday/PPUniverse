name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ppuniverse
          POSTGRES_PASSWORD: ppuniverse
          POSTGRES_DB: ppuniverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppuniverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        # bitnami/minio:latest no longer exists on Docker Hub (Bitnami moved
        # free/frozen images to the bitnamilegacy org — confirmed via the
        # Docker Hub API after the first real CI run failed with "manifest
        # unknown"). bitnamilegacy/minio:latest is the working equivalent.
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          # Disable the embedded web console: a known bitnami/minio bug
          # ("Specified port is already in use" on the console port, see
          # bitnami/containers#30684) prevents the container starting in
          # some versions of the GitHub Actions service-container context.
          # The app only ever uses the S3 API port (9000), never the
          # console, so disabling it removes that failure path entirely.
          MINIO_BROWSER: "off"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 120s
    env:
      DATABASE_URL: postgresql://ppuniverse:ppuniverse@localhost:5432/ppuniverse?schema=public
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: ppuniverse-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      CLAMAV_HOST: localhost
      CLAMAV_PORT: 3310
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations (integration test database)
        run: pnpm --filter @ppu/db exec prisma migrate deploy

      - name: Test (unit + integration)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  accessibility:
    name: "Accessibility shard ${{ matrix.shard }}/${{ strategy.job-total }}"
    # Sharded across 4 parallel jobs (docs/final-decisions.md, "Accessibility suite
    # mitigation", 2026-09-23 — the standing mitigation trigger from MVP-023's Q39 fired
    # when MVP-017 was about to add page states). Every engine, every width and the full
    # rule set are preserved unchanged; only how the SAME test list is distributed across
    # runners changed. Governing budget is now PER-SHARD TEST EXECUTION: target under 5
    # minutes, ceiling 8 minutes. Job wall-clock is still reported but is no longer the
    # gate — fixed per-shard overhead (~118s: deps, browser install, build) makes it a
    # poor proxy once sharded. fail-fast: false so every shard runs to completion and
    # reports its own full evidence even if another shard fails.
    #
    # Deterministic by construction: Playwright's own --shard flag partitions the fully
    # resolved, sorted test list by index, the same way for the same commit — no time or
    # load-based assignment (verified locally: three consecutive --list runs of the same
    # shard index returned the identical test set and count).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ppuniverse
          POSTGRES_PASSWORD: ppuniverse
          POSTGRES_DB: ppuniverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppuniverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ppuniverse:ppuniverse@localhost:5432/ppuniverse?schema=public
      # The harness writes temporary rows (reserved prefix, deleted afterwards) to this
      # throwaway service container only, and its guard refuses any other database. Each
      # shard job gets its own, independent service container — shards never share a
      # database, so nothing new to isolate beyond what worker-scoping already handled.
      E2E_ALLOW_DATABASE_WRITES: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Start the job clock
        run: echo "PPU_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: |
          start=$(date +%s)
          pnpm install --frozen-lockfile
          echo "PPU_SECONDS_DEPS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Read the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/e2e/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      # The browsers are Playwright's bundled builds, fixed by the exact pinned version, so
      # keying the cache on that version cannot let a browser drift. Shared cache key across
      # shards (no shard index in it) — every shard installs the identical pinned browsers.
      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers and system dependencies
        run: |
          start=$(date +%s)
          pnpm --filter @ppu/e2e exec playwright install --with-deps chromium firefox webkit
          echo "PPU_SECONDS_BROWSERS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "PPU_BROWSER_CACHE=${{ steps.browser-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: pnpm --filter @ppu/db exec prisma migrate deploy

      - name: Build the application
        run: |
          start=$(date +%s)
          pnpm build
          echo "PPU_SECONDS_BUILD=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # This shard's slice of the main page-state/keyboard/regression matrix. The
      # unconditional self-check (negative-controls.spec.ts) is excluded here and run in
      # full, separately, below — every shard must independently prove the gate can still
      # fail, not just the shard it happened to be sharded into (constraint 3 of the
      # mitigation decision). continue-on-error so the self-check step below still runs
      # even if this one fails; a later step fails the job if either did.
      - name: Run this shard's slice of the accessibility suite
        id: main
        continue-on-error: true
        run: |
          start=$(date +%s)
          pnpm --filter @ppu/e2e exec playwright test tests/a11y \
            --shard=${{ matrix.shard }}/4 \
            --grep-invert "negative controls: the accessibility gate can fail"
          echo "PPU_SECONDS_TESTS_MAIN=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # Every shard, every engine, unconditionally (docs/final-decisions.md,
      # "Accessibility suite mitigation": "It is not a single-shard responsibility"). A
      # separate output-path namespace (E2E_OUTPUT_SUFFIX / E2E_SUMMARY_PATH) so this run
      # cannot clobber the main slice's report/results above — confirmed locally that two
      # unnamespaced invocations in the same job silently overwrite each other's summary.
      - name: Run the unconditional self-check (all three engines, every shard)
        id: selfcheck
        continue-on-error: true
        env:
          E2E_OUTPUT_SUFFIX: "-selfcheck"
          E2E_SUMMARY_PATH: "results/summary-selfcheck.md"
        run: |
          start=$(date +%s)
          pnpm --filter @ppu/e2e exec playwright test tests/a11y/negative-controls.spec.ts
          echo "PPU_SECONDS_SELFCHECK=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Fail the shard if either run failed
        if: steps.main.outcome == 'failure' || steps.selfcheck.outcome == 'failure'
        run: exit 1

      - name: Job summary (timing and results)
        if: always()
        run: |
          now=$(date +%s)
          main_secs="${PPU_SECONDS_TESTS_MAIN:-0}"
          self_secs="${PPU_SECONDS_SELFCHECK:-0}"
          {
            echo "## Accessibility gate — shard ${{ matrix.shard }}/4"
            echo
            echo "### Timing, measured in this job"
            echo
            echo "| Phase | Seconds |"
            echo "|---|---|"
            echo "| Dependencies install (pnpm) | ${PPU_SECONDS_DEPS:-n/a} |"
            echo "| Browsers and system dependencies (browser cache: ${PPU_BROWSER_CACHE:-n/a}) | ${PPU_SECONDS_BROWSERS:-n/a} |"
            echo "| Application build | ${PPU_SECONDS_BUILD:-n/a} |"
            echo "| Test execution — this shard's main slice | ${PPU_SECONDS_TESTS_MAIN:-n/a} |"
            echo "| Test execution — unconditional self-check | ${PPU_SECONDS_SELFCHECK:-n/a} |"
            echo "| Test execution — total (main + self-check) | $(( main_secs + self_secs )) |"
            echo "| From the first step to this one (excludes runner start-up) | $(( now - ${PPU_JOB_START:-now} )) |"
            echo
            echo "### Main slice"
            if [ -f packages/e2e/results/summary.md ]; then cat packages/e2e/results/summary.md; else echo "No test summary was produced."; fi
            echo
            echo "### Self-check"
            if [ -f packages/e2e/results/summary-selfcheck.md ]; then cat packages/e2e/results/summary-selfcheck.md; else echo "No self-check summary was produced."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report-shard-${{ matrix.shard }}
          path: |
            packages/e2e/playwright-report
            packages/e2e/playwright-report-selfcheck
            packages/e2e/results
            packages/e2e/test-results
            packages/e2e/test-results-selfcheck
          retention-days: 14
          if-no-files-found: warn

  accessibility-summary:
    name: Accessibility (axe + Playwright)
    # The single required check — unchanged name, so branch protection's existing
    # required-status-check configuration needs no update. Depends on every shard;
    # needs.accessibility.result is Actions' own aggregate across the whole matrix, so
    # this fails if ANY shard failed. A partial-pass merge is impossible: there is no way
    # for this check to report success while a shard is still failing or pending.
    needs: accessibility
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every shard passed
        run: |
          if [ "${{ needs.accessibility.result }}" != "success" ]; then
            echo "One or more accessibility shards did not pass (result: ${{ needs.accessibility.result }})."
            exit 1
          fi
          echo "All accessibility shards passed."

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
